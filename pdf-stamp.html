<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ختم PDF - اليامي للسفر</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#16324f;--muted:#64748b;--gold:#c9a227;--navy:#16324f;--line:#e2e8f0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,"Segoe UI",Tahoma,sans-serif}
header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px}
header img{height:40px}
header h1{font-size:17px;margin:0;font-weight:600}
main{max-width:980px;margin:22px auto;padding:0 16px;display:grid;grid-template-columns:1fr 340px;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
#drop{border:2px dashed #b9c6d6;border-radius:12px;padding:44px 18px;text-align:center;color:var(--muted);cursor:pointer;background:#fbfcfe}
#drop.on{border-color:var(--gold);background:#fffbef;color:var(--navy)}
label{display:block;font-size:13px;margin:14px 0 6px;color:var(--muted)}
input[type=text],textarea,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:14px;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:62px}
input[type=range]{width:100%}
.row{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:14px}
.row input[type=checkbox]{width:17px;height:17px;accent-color:var(--gold)}
button{background:var(--navy);color:#fff;border:0;border-radius:9px;padding:11px 18px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button.alt{background:#fff;color:var(--navy);border:1px solid var(--line);font-weight:400;font-size:13px;padding:7px 12px}
#files{margin-top:14px;font-size:14px}
#files div{padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.ok{color:#15803d}.err{color:#b91c1c}
#logoPrev{width:100%;height:110px;object-fit:contain;background:#fbfcfe;border:1px solid var(--line);border-radius:8px}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#fbfcfe;border:1px solid var(--line);border-radius:8px;padding:6px}
#grid button{aspect-ratio:1.5;background:#fff;border:1px solid var(--line);border-radius:6px;padding:0;font-size:11px;font-weight:400;color:var(--muted)}
#grid button.on{background:var(--navy);border-color:var(--navy);color:#fff}
small{color:var(--muted);font-size:12px;line-height:1.7;display:block;margin-top:10px}
@media(max-width:800px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <img id="brand" alt="">
  <h1>ختم الشعار على ملفات PDF</h1>
</header>

<main>
  <section class="card">
    <div id="drop">اسحب ملفات PDF هنا أو اضغط للاختيار<br><small>تقدر تختار أكثر من ملف مرة وحدة</small></div>
    <input type="file" id="pick" accept="application/pdf" multiple hidden>
    <div id="files"></div>
    <div style="margin-top:16px;display:flex;gap:10px;align-items:center">
      <button id="go" disabled>ختم وتنزيل</button>
      <button class="alt" id="clear">مسح القائمة</button>
    </div>
  </section>

  <aside class="card">
    <label>الشعار</label>
    <img id="logoPrev" alt="">
    <button class="alt" id="chLogo" style="margin-top:8px">تغيير الشعار</button>
    <button class="alt" id="rsLogo" style="margin-top:8px">استرجاع الأصلي</button>
    <input type="file" id="logoPick" accept="image/png,image/jpeg" hidden>

    <label>النمط</label>
    <select id="mode">
      <option value="head">ترويسة أعلى الصفحة</option>
      <option value="mark">علامة مائية في المنتصف</option>
    </select>

    <label>موضع الشعار على الورقة</label>
    <div id="grid">
      <button data-x="right" data-y="top">أعلى يمين</button>
      <button data-x="center" data-y="top">أعلى وسط</button>
      <button data-x="left" data-y="top">أعلى يسار</button>
      <button data-x="right" data-y="middle">وسط يمين</button>
      <button data-x="center" data-y="middle">المنتصف</button>
      <button data-x="left" data-y="middle">وسط يسار</button>
      <button data-x="right" data-y="bottom">أسفل يمين</button>
      <button data-x="center" data-y="bottom">أسفل وسط</button>
      <button data-x="left" data-y="bottom">أسفل يسار</button>
    </div>

    <label>حجم الشعار: <span id="szV">90</span></label>
    <input type="range" id="sz" min="30" max="400" value="90">

    <label>الشفافية: <span id="opV">100%</span></label>
    <input type="range" id="op" min="10" max="100" value="100">

    <label>الهامش الأفقي: <span id="mxV">22</span></label>
    <input type="range" id="mx" min="0" max="150" value="22">

    <label>الهامش الرأسي: <span id="myV">22</span></label>
    <input type="range" id="my" min="0" max="150" value="22">

    <label>نص الترويسة (اختياري)</label>
    <textarea id="txt" placeholder="شركة اليامي للسفر والسياحة&#10;0500000000"></textarea>

    <div class="row"><input type="checkbox" id="bg"><span>شريط أبيض خلف الشعار</span></div>
    <div class="row"><input type="checkbox" id="first"><span>الصفحة الأولى فقط</span></div>

    <small>الإعدادات تُحفظ تلقائياً. الملفات تُعالج داخل متصفحك ولا تُرفع لأي مكان.</small>
  </aside>
</main>

<script>
const { PDFDocument, rgb } = PDFLib;
const $ = id => document.getElementById(id);
const S = JSON.parse(localStorage.getItem('stamp') || '{}');
let logo = S.logo || LOGO_DATA, queue = [];
let px = S.px || 'right', py = S.py || 'top';

$('brand').src = LOGO_DATA;
$('logoPrev').src = logo;
['mode','txt'].forEach(k => { if (S[k] != null) $(k).value = S[k]; });
['bg','first'].forEach(k => { if (S[k] != null) $(k).checked = S[k]; });
['sz','op','mx','my'].forEach(k => { if (S[k] != null) $(k).value = S[k]; });

function labels() {
  $('szV').textContent = $('sz').value;
  $('opV').textContent = $('op').value + '%';
  $('mxV').textContent = $('mx').value;
  $('myV').textContent = $('my').value;
  [...$('grid').children].forEach(b =>
    b.classList.toggle('on', b.dataset.x === px && b.dataset.y === py));
}
function save() {
  localStorage.setItem('stamp', JSON.stringify({
    logo, mode: $('mode').value, px, py, txt: $('txt').value, sz: $('sz').value,
    op: $('op').value, mx: $('mx').value, my: $('my').value,
    bg: $('bg').checked, first: $('first').checked
  }));
}
$('grid').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  px = b.dataset.x; py = b.dataset.y; labels(); save();
};
document.querySelectorAll('select,textarea,input[type=range],input[type=checkbox]').forEach(e => {
  e.addEventListener('input', () => { labels(); save(); });
});
labels();

$('drop').onclick = () => $('pick').click();
$('drop').ondragover = e => { e.preventDefault(); $('drop').classList.add('on'); };
$('drop').ondragleave = () => $('drop').classList.remove('on');
$('drop').ondrop = e => { e.preventDefault(); $('drop').classList.remove('on'); add(e.dataTransfer.files); };
$('pick').onchange = e => add(e.target.files);
$('clear').onclick = () => { queue = []; render(); };

$('chLogo').onclick = () => $('logoPick').click();
$('logoPick').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { logo = r.result; $('logoPrev').src = logo; save(); };
  r.readAsDataURL(f);
};
$('rsLogo').onclick = () => { logo = LOGO_DATA; $('logoPrev').src = logo; save(); };

function add(list) {
  for (const f of list) if (f.type === 'application/pdf') queue.push({ f, st: '', cls: '' });
  render();
}
function render() {
  $('files').innerHTML = queue.map(q =>
    '<div><span>' + q.f.name + '</span><span class="' + q.cls + '">' + q.st + '</span></div>').join('');
  $('go').disabled = !queue.length;
}

function textPng(text) {
  const lines = text.split('\n').map(s => s.trim()).filter(Boolean);
  if (!lines.length) return null;
  const F = 46, pad = 10;
  const c = document.createElement('canvas'), x = c.getContext('2d');
  const font = '600 ' + F + 'px Cairo, Segoe UI, Tahoma, sans-serif';
  x.font = font;
  const w = Math.max.apply(null, lines.map(l => x.measureText(l).width));
  c.width = Math.ceil(w) + pad * 2;
  c.height = Math.ceil(lines.length * F * 1.35) + pad * 2;
  const g = c.getContext('2d');
  g.font = font;
  g.fillStyle = '#16324f';
  g.textBaseline = 'top';
  g.direction = 'rtl';
  g.textAlign = px === 'left' ? 'left' : px === 'center' ? 'center' : 'right';
  const ax = px === 'left' ? pad : px === 'center' ? c.width / 2 : c.width - pad;
  lines.forEach((l, i) => g.fillText(l, ax, pad + i * F * 1.35));
  return c.toDataURL('image/png');
}

async function embed(doc, dataUrl) {
  const bin = atob(dataUrl.slice(dataUrl.indexOf(',') + 1));
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return dataUrl.indexOf('image/jpeg') > -1 ? doc.embedJpg(arr) : doc.embedPng(arr);
}

$('go').onclick = async () => {
  $('go').disabled = true;
  await document.fonts.ready;
  const mode = $('mode').value;
  const lw = +$('sz').value, opacity = +$('op').value / 100;
  const mx = +$('mx').value, my = +$('my').value, gap = 12;
  const tData = mode === 'head' ? textPng($('txt').value) : null;

  for (const q of queue) {
    try {
      q.st = 'جاري...'; q.cls = ''; render();
      const doc = await PDFDocument.load(await q.f.arrayBuffer(), { ignoreEncryption: true });
      const img = await embed(doc, logo);
      const txt = tData ? await embed(doc, tData) : null;
      const pages = $('first').checked ? [doc.getPages()[0]] : doc.getPages();

      for (const p of pages) {
        const size = p.getSize(), W = size.width, H = size.height;
        const w = Math.min(lw, W - mx * 2), h = w * img.height / img.width;
        const x = px === 'right' ? W - mx - w : px === 'left' ? mx : (W - w) / 2;
        const y = py === 'top' ? H - my - h : py === 'bottom' ? my : (H - h) / 2;
        const th = txt ? h * 0.6 : 0, tw = txt ? th * txt.width / txt.height : 0;
        let tx = 0, ty = 0;
        if (txt) {
          if (px === 'center') {
            tx = (W - tw) / 2;
            ty = py === 'bottom' ? y + h + gap : y - gap - th;
          } else {
            tx = px === 'right' ? x - gap - tw : x + w + gap;
            ty = y + (h - th) / 2;
          }
        }
        if ($('bg').checked) {
          const hi = Math.max(y + h, txt ? ty + th : 0), lo = Math.min(y, txt ? ty : H);
          p.drawRectangle({ x: 0, y: lo - my / 2, width: W, height: hi - lo + my, color: rgb(1, 1, 1) });
        }
        p.drawImage(img, { x, y, width: w, height: h, opacity });
        if (txt) p.drawImage(txt, { x: tx, y: ty, width: tw, height: th, opacity });
      }

      const out = await doc.save();
      const url = URL.createObjectURL(new Blob([out], { type: 'application/pdf' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = q.f.name.replace(/\.pdf$/i, '') + '-اليامي.pdf';
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      q.st = 'تم'; q.cls = 'ok';
    } catch (e) {
      q.st = 'فشل: ' + e.message; q.cls = 'err';
    }
    render();
  }
  $('go').disabled = false;
};
</script>
